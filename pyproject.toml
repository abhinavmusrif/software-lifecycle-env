[project]
name = "software-lifecycle-env"
version = "1.0.0"
description = "Deterministic benchmark environment for evaluating AI agents on software lifecycle tasks"
authors = [{name = "Musrif Abhinav"}]
requires-python = ">=3.10"

dependencies = [
"fastapi",
"uvicorn",
"pydantic",
"openai",
"pyyaml",
"openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["env*", "server*"]

[tool.uv.sources]
openenv = { path = ".openenv-shim" }
